name: Build Harmony EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Harmony.py"
      - "harmony.ico"
      - "requirements.txt"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify required project files
        shell: pwsh
        run: |
          if (!(Test-Path "Harmony.py")) { throw "Harmony.py was not found in the repository root." }
          if (!(Test-Path "harmony.ico")) { throw "harmony.ico was not found in the repository root." }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build one-file executable with PyInstaller
        run: >
          pyinstaller
          --noconfirm
          --onedir
          --windowed
          --icon=harmony.ico
          --add-data "harmony.ico;."
          --collect-all yt_dlp
          --collect-all certifi
          --distpath dist
          --workpath build
          --name Harmony
          Harmony.py

      # Create a portable single ZIP file containing the bundle
      - name: Create Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Harmony/*" -DestinationPath "dist/Harmony-Windows-x64.zip"

      - name: Verify ZIP was created
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Harmony-Windows-x64.zip")) {
            throw "Build finished without producing Harmony-Windows-x64.zip"
          }
          Get-Item "dist/Harmony-Windows-x64.zip" | Select-Object FullName, Length

      - name: Upload Harmony Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harmony-Windows-x64
          path: dist/Harmony-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
